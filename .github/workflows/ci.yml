name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # An unmatched glob makes `node --test` print `tests 0` and exit 0 — a silent pass that
      # looks identical to a green suite. The exit code alone is therefore not evidence the
      # tests ran, so the `tests N` line is asserted explicitly.
      - name: Test suite
        run: |
          node --test "scripts/test/*.test.mjs" "telemetry/test/*.test.mjs" > test-output.txt 2>&1 || {
            cat test-output.txt
            exit 1
          }
          cat test-output.txt
          grep -qE '^ℹ tests [1-9]' test-output.txt || {
            echo "::error::No tests ran — the glob matched nothing."
            exit 1
          }

      # A SKILL.md or agent .md whose frontmatter fails to parse is listed with no
      # description and becomes unroutable — this gate catches it before it ships. One step
      # covers both roots: the default invocation resolves both skills/ and agents/ relative
      # to the script's own directory, not this job's cwd, so it always checks both no
      # matter where CI runs it from. Two same-scope steps would be misleading (either one
      # reddening for either root's problem) with no added coverage.
      - name: Frontmatter publishes (skills + agents)
        run: node scripts/verify-frontmatter.mjs
